<!--
  GymPlan
  Файл: index.html
  Версия: 1.3.0
  Описание: Добавлен аварийный сброс кэша и Service Worker, если приложение не запустилось за 4 секунды.
-->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0f11">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://st.max.ru; style-src 'self' 'unsafe-inline'; img-src 'self' https://d3d2ynhodh9o1z.cloudfront.net data:; connect-src 'self'; form-action 'none'; base-uri 'self'; object-src 'none';">
<title>GymPlan</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="stylesheet" href="styles.css">
<script src="https://st.max.ru/js/max-web-app.js"></script>
</head>
<body>
<div id="app"><div class="loading">Загрузка...</div></div>
<input type="file" id="importFile" accept=".json" style="display:none">
<script type="module" src="js/main.js"></script>
<script>
  // Аварийный сброс, если main.js не загрузился за 4 секунды
  window.addEventListener('load', () => {
    setTimeout(() => {
      if (!window.__GYMPLAN_LOADED) {
        console.warn('[GymPlan] Не загрузилось, сбрасываем SW и кэш...');
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(regs => {
            for (let reg of regs) reg.unregister();
          });
        }
        if ('caches' in window) {
          caches.keys().then(keys => {
            Promise.all(keys.map(k => caches.delete(k))).then(() => location.reload());
          });
        } else {
          location.reload();
        }
      }
    }, 4000);
  });
</script>
</body>
</html>
